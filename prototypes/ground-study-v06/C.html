</style><header><small>风栖原野 / GROUND ART STUDIES</small><h1>先看草地，再决定方向</h1><p>三个独立静态样板 · 相同出生点布局与镜头 · 1280 × 720 · 树木、石头、角色使用原画面</p><nav><a href="A.html" data-key="A">A 柔和手绘</a><a href="B.html" data-key="B">B 精致卡通</a><a href="C.html" data-key="C">C 自然原野</a><a href="comparison.html">三图对比</a></nav></header><main><h2 id="name"></h2><p id="desc" class="note"></p><div class="controls"><label><input id="objects" type="checkbox" checked> 显示场景参照</label><label><input id="actual" type="checkbox"> 原始 1:1 像素</label><a id="png" download>保存同视角图片</a></div><div class="scroll"><div class="scene" id="scene"><img id="ground" alt="地面纹理样板"><img id="overlay" src="scene-overlay.png" alt="固定的原有树木石头与角色参照"></div></div><footer>仅为独立美术预览，尚未选定或集成。取消场景参照可单独检查地面；浏览器缩放为 100% 时勾选原始像素查看游戏显示尺度。</footer></main><script>
const key=location.pathname.match(/([ABC])\.html$/)?.[1]||'A';
const names={A:'A · 柔和手绘草地',B:'B · 精致卡通草地',C:'C · 自然原野草地'};
const desc={A:'稀疏的轻柔草痕与近色笔触，留白最多，整体偏清新安静。',B:'短草、细小亮面与局部地表笔触，强调精致的卡通绘制感。',C:'疏密变化的细草组合与自然走向，强调原野感和地面肌理。'};
document.querySelector('#name').textContent=names[key];document.querySelector('#desc').textContent=desc[key];document.querySelector('#ground').src='ground-'+key+'.png';document.querySelector('[data-key="'+key+'"]').classList.add('active');document.querySelector('#png').href='preview-'+key+'.png';document.querySelector('#objects').onchange=e=>document.querySelector('#overlay').hidden=!e.target.checked;document.querySelector('#actual').onchange=e=>document.querySelector('#scene').classList.toggle('actual',e.target.checked);
</script></html>
