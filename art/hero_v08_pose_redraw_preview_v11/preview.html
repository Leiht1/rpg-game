t(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:0 10px;margin:14px auto}h1{font-size:20px}.views{gap:7px}.view h2{font-size:12px;padding:7px}.stage{padding:7px 0}.detail{font-size:11px;padding:6px}.status{width:100%;margin:0}.bar{gap:6px}button{padding:5px 9px;font-size:13px}.frames button{padding:3px 9px}}

<h1>v11 重绘预览 · 沿用 v08 的 8 个姿势</h1>
<p>逐帧对照原动作，检查头、身体、手脚的比例与清晰度。正视和背视作为同尺度参考。</p>
<div class="bar"><button id="play">暂停</button><button id="normal" class="active">原速</button><button id="slow">半速</button><button id="one">1 倍</button><button id="two" class="active">2 倍</button><label><input type="checkbox" id="dark">暗底</label><label><input type="checkbox" id="guides">对齐线</label><span class="status" id="status">正在载入…</span></div>
<div class="bar frames" id="frames" aria-label="逐帧选择"></div>
<section class="views">
<article class="view"><h2>v08 原姿势 · 对照</h2><div class="stage"><canvas id="old" width="128" height="128" aria-label="v08原姿势"></canvas></div><div class="detail">原帧保留 · 同步第1～8帧</div></article>
<article class="view"><h2>v11 整套重绘 · 候选</h2><div class="stage"><canvas id="right" width="128" height="128" aria-label="v11重绘候选"></canvas></div><div class="detail">统一身体样板 · 128×128</div></article>
<article class="view"><h2>正视 · 已确认参考</h2><div class="stage"><canvas id="front" width="128" height="128" aria-label="正视参考"></canvas></div><div class="detail">原动作 · 同倍率显示</div></article>
<article class="view"><h2>背视 · 已确认参考</h2><div class="stage"><canvas id="back" width="128" height="128" aria-label="背视参考"></canvas></div><div class="detail">原动作 · 同倍率显示</div></article>
</section>
<div class="note">本版按 v08 的逐帧姿势重绘完整侧视人物，保留原有动作顺序和前后遮挡。原速检查循环，半速或帧号检查姿势。仍是待确认预览，游戏素材尚未替换。</div>
<p style="margin-top:13px"><a href="side_before_after_slow.webp">半速新旧对照</a> · <a href="crossview_walk.webp">三视图动图</a> · <a href="pose_comparison_contact.png">逐帧放大对照</a> · <a href="RESULT.md">制作记录</a></p>
<img class="contact" src="side_contact.png" alt="重绘后的八帧编号图">
</main><script>
let current=0,playing=true,fps=13.8,last=performance.now(),loaded=false;
const paths={old:'side_v08_sheet.png',right:'right_walk_preview/right_walk_sheet.png',front:'front_walk_preview/front_walk_sheet.png',back:'back_walk_preview/back_walk_sheet.png'},images={},buttons=[];
const play=document.getElementById('play'),status=document.getElementById('status');
for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label','查看第 '+(i+1)+' 帧');b.onclick=()=>{playing=false;play.textContent='播放';current=i;draw()};buttons.push(b);document.getElementById('frames').appendChild(b)}
function draw(){if(!loaded)return;for(const key of Object.keys(paths)){const c=document.getElementById(key),ctx=c.getContext('2d');ctx.clearRect(0,0,128,128);ctx.drawImage(images[key],current%4*128,Math.floor(current/4)*128,128,128,0,0,128,128);if(document.getElementById('guides').checked){ctx.save();ctx.lineWidth=.5;ctx.strokeStyle='#8e6d32';ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(128,20);ctx.moveTo(0,112);ctx.lineTo(128,112);ctx.moveTo(64,108);ctx.lineTo(64,116);ctx.stroke();ctx.restore()}}buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));status.textContent='第 '+(current+1)+' / 8 帧 · '+fps+' 帧/秒'}
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';last=performance.now()};
function speed(v,id){fps=v;last=performance.now();for(const n of ['normal','slow'])document.getElementById(n).classList.toggle('active',n===id);draw()}
document.getElementById('normal').onclick=()=>speed(13.8,'normal');document.getElementById('slow').onclick=()=>speed(6.9,'slow');
function scale(v,id){document.querySelectorAll('canvas').forEach(c=>{c.style.width=(128*v)+'px';c.style.height='auto'});for(const n of ['one','two'])document.getElementById(n).classList.toggle('active',n===id)}
document.getElementById('one').onclick=()=>scale(1,'one');document.getElementById('two').onclick=()=>scale(2,'two');document.getElementById('dark').onchange=e=>document.body.classList.toggle('dark',e.target.checked);document.getElementById('guides').onchange=draw;
Promise.all(Object.entries(paths).map(([key,src])=>new Promise((resolve,reject)=>{const im=new Image;images[key]=im;im.onload=resolve;im.onerror=reject;im.src=src}))).then(()=>{loaded=true;draw()}).catch(()=>status.textContent='图集未能加载，请刷新页面');
function tick(now){if(loaded&&playing&&now-last>=1000/fps){const steps=Math.floor((now-last)/(1000/fps));current=(current+steps)%8;last+=steps*(1000/fps);draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
